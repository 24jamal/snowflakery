- snowfakery_version: 3

- plugin: snowfakery.standard_plugins.datasets.Dataset

- object: Contact
  fields:
    FirstName:
      fake: FirstName
    LastName:
      fake: LastName

    BillingStreet:
      expression: |
        ${{row.Number}} ${{row.Street}}

    BillingCity: ${{row.City}}
    BillingState: Texas
    BillingPostalCode: ${{row.Postcode}}
    BillingCountry: US

  friends:
    - object: AddressData
      fields:
        row:
          dataset:
            fields:
              - Number
              - Street
              - City
              - Postcode
            file: addresses.csv